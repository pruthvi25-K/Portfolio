<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-glass-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="indigo-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-glass-1)"/>
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.15" filter="blur(40px)"/>
  <circle cx="600" cy="300" r="160" fill="#a855f7" opacity="0.15" filter="blur(40px)"/>

  <!-- Neural Nodes & Glass Connections -->
  <path d="M 150 280 Q 320 120 480 220 T 720 160" fill="none" stroke="url(#indigo-purple)" stroke-width="3.5"/>
  <path d="M 150 180 Q 320 340 480 140 T 720 280" fill="none" stroke="url(#cyan-violet)" stroke-opacity="0.7" stroke-width="2.5" stroke-dasharray="6 6"/>

  <circle cx="150" cy="280" r="12" fill="#38bdf8"/>
  <circle cx="320" cy="200" r="16" fill="#818cf8"/>
  <circle cx="480" cy="220" r="14" fill="#a855f7"/>
  <circle cx="720" cy="160" r="18" fill="#c084fc"/>

  <!-- Frosty Glass Card Overlay -->
  <rect x="60" y="50" width="340" height="135" rx="12" fill="rgba(17, 24, 39, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
  <text x="90" y="90" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">> AI_AGENT_SWARM_ORCHESTRATION</text>
  <text x="90" y="120" fill="#34d399" font-family="monospace" font-size="14">WORKFLOW ACCURACY: 99.8% [OPTIMAL]</text>
  <text x="90" y="148" fill="#cbd5e1" font-family="monospace" font-size="12">AGENT THREADS: 128 ACTIVE PIPELINES</text>
</svg>
