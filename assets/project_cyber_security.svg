<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="glass-sphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#05070e" stop-opacity="0.9"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="#05070e"/>
  
  <!-- Glowing Glass Sphere -->
  <circle cx="400" cy="225" r="165" fill="url(#glass-sphere)" stroke="rgba(192, 132, 252, 0.5)" stroke-width="1.5"/>
  <ellipse cx="400" cy="225" rx="165" ry="65" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <ellipse cx="400" cy="225" rx="65" ry="165" fill="none" stroke="#818cf8" stroke-width="1.5"/>

  <!-- Data Flows -->
  <line x1="250" y1="170" x2="400" y2="225" stroke="#c084fc" stroke-width="2.5"/>
  <circle cx="250" cy="170" r="7" fill="#c084fc"/>
  
  <line x1="550" y1="280" x2="400" y2="225" stroke="#34d399" stroke-width="2.5"/>
  <circle cx="550" cy="280" r="7" fill="#34d399"/>

  <!-- Glass HUD Panels -->
  <rect x="40" y="40" width="240" height="115" rx="10" fill="rgba(17, 24, 39, 0.8)" stroke="rgba(192, 132, 252, 0.4)"/>
  <text x="60" y="72" fill="#c084fc" font-family="monospace" font-size="14" font-weight="bold">AUTOMATION METRICS</text>
  <text x="60" y="98" fill="#38bdf8" font-family="monospace" font-size="12">EVENTS PROCESSED: 2.4M/DAY</text>
  <text x="60" y="128" fill="#34d399" font-family="monospace" font-size="11">SYSTEM HEALTH: OPTIMAL [100%]</text>

  <rect x="520" y="40" width="240" height="115" rx="10" fill="rgba(17, 24, 39, 0.8)" stroke="rgba(56, 189, 248, 0.4)"/>
  <text x="540" y="72" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">WORKFLOW ROUTING</text>
  <text x="540" y="98" fill="#fbbf24" font-family="monospace" font-size="12">FAILOVER NODE: ONLINE</text>
  <text x="540" y="128" fill="#cbd5e1" font-family="monospace" font-size="11">CLUSTER: CLOUD_US_EAST_1</text>
</svg>
