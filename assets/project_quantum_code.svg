<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="glass-bg-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#glass-bg-2)"/>
  
  <!-- Editor Window Frosty Glass Container -->
  <rect x="40" y="35" width="720" height="380" rx="14" fill="rgba(17, 24, 39, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <path d="M 40 49 A 14 14 0 0 1 54 35 L 746 35 A 14 14 0 0 1 760 49 L 760 75 L 40 75 Z" fill="rgba(30, 41, 59, 0.8)"/>
  <circle cx="70" cy="55" r="6" fill="#ef4444"/>
  <circle cx="90" cy="55" r="6" fill="#f59e0b"/>
  <circle cx="110" cy="55" r="6" fill="#10b981"/>
  <text x="140" y="60" fill="#94a3b8" font-family="monospace" font-size="13">document_automation_pipeline.py — Gemini LLM Engine</text>

  <!-- Code Content -->
  <text x="70" y="115" fill="#c084fc" font-family="monospace" font-size="15">async def <tspan fill="#38bdf8">parse_document_with_gemini</tspan>(file_stream: Stream):</text>
  <text x="100" y="150" fill="#cbd5e1" font-family="monospace" font-size="15">prompt = <tspan fill="#fbbf24">"Extract key invoice fields, totals, and line items into JSON."</tspan></text>
  <text x="100" y="185" fill="#34d399" font-family="monospace" font-size="15"># Executing Gemini multimodal extraction pipeline</text>
  <text x="100" y="220" fill="#cbd5e1" font-family="monospace" font-size="15">structured_data = await gemini_api.generate_content(prompt, file_stream)</text>
  <text x="100" y="255" fill="#c084fc" font-family="monospace" font-size="15">return <tspan fill="#34d399">WebhookResponse(status="SUCCESS", data=structured_data)</tspan></text>

  <!-- Floating Glass Spec Badge -->
  <rect x="470" y="235" width="260" height="150" rx="12" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(168, 85, 247, 0.4)"/>
  <text x="500" y="275" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">PIPELINE METRICS</text>
  <text x="500" y="310" fill="#c084fc" font-family="monospace" font-size="22" font-weight="bold">10,000 DOCS/HR</text>
  <text x="500" y="345" fill="#34d399" font-family="monospace" font-size="12">WEBHOOK SUCCESS RATE: 99.9%</text>
</svg>
